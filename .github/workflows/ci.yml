name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check
        run: npm run typecheck
      - name: Unit & API tests
        run: npm test
      - name: Scoring simulation
        run: npm run simulate
      - name: Production build (local mode)
        run: npx vite build
      - name: Production build (single-origin ranking mode)
        run: VITE_API_BASE=/ npx vite build --outDir dist-online
      - name: Commit generated lockfile (first run only)
        if: github.event_name == 'push' && hashFiles('package-lock.json') != ''
        run: |
          if git status --porcelain package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add package-lock.json generated by CI"
            git push
          fi
